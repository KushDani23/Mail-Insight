# ════════════════════════════════════════════════════════════════════════
#  AI Mail Analyzer – application.properties
#  All secrets are read from environment variables.
#  NEVER hardcode credentials here.
# ════════════════════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────────────────
server.port=8080

# ── DataSource  (Neon PostgreSQL) ────────────────────────────────────────
# Set these env vars in Render dashboard:
#   SPRING_DATASOURCE_URL      jdbc:postgresql://<neon-host>/neondb?sslmode=require
#   SPRING_DATASOURCE_USERNAME <neon-user>
#   SPRING_DATASOURCE_PASSWORD <neon-password>
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate → Hibernate validates schema against entities (safer for prod)
# update  → Hibernate auto-creates/alters tables (OK for early dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Google OAuth2 ────────────────────────────────────────────────────────
# Set these env vars in Render dashboard:
#   GOOGLE_CLIENT_ID      <your-oauth2-client-id>
#   GOOGLE_CLIENT_SECRET  <your-oauth2-client-secret>
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# Scopes: openid + profile for login, gmail.readonly for email access
spring.security.oauth2.client.registration.google.scope=openid,email,profile,https://www.googleapis.com/auth/gmail.readonly
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

# Force offline access so Google returns a refresh token (needed for long-lived Gmail access)
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ── Spring AI – Google GenAI (Gemini) ───────────────────────────────────
# We EXCLUDE Spring AI's auto-configuration because every user has their
# own Gemini API key. GeminiService builds a ChatClient per user at runtime.
spring.autoconfigure.exclude=org.springframework.ai.google.genai.autoconfigure.GoogleGenAiAutoConfiguration

# ── Session ─────────────────────────────────────────────────────────────
# HTTP-only cookie session (no JWT)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=None
# Session timeout: 7 days
server.servlet.session.timeout=604800s

# ── CORS ─────────────────────────────────────────────────────────────────
# Set this env var to your Vercel frontend URL, e.g. https://mail-analyzer.vercel.app
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ── Application secrets ──────────────────────────────────────────────────
# AES-256 key for encrypting OAuth refresh tokens and Gemini API keys.
# Generate with: openssl rand -base64 32
# Set as env var: ENCRYPTION_SECRET
app.encryption.secret=${ENCRYPTION_SECRET}

# ── Gmail API ────────────────────────────────────────────────────────────
app.gmail.application-name=AI Mail Analyzer

# ── Logging ─────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.mailanalyzer=INFO
logging.level.org.springframework.security=WARN
