services:
  - type: web
    name: backend
    runtime: java
    buildCommand: cd backend && ./mvnw clean package -DskipTests
    startCommand: java -jar backend/target/mail-insight-0.0.1-SNAPSHOT.jar
    plan: free
    healthCheckPath: /api/auth/me
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false  
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: ENCRYPTION_SECRET
        sync: false

      - key: FRONTEND_ORIGIN
        sync: false

      - key: JAVA_OPTS
        value: -Xmx400m -Xss512k -XX:+UseSerialGC
